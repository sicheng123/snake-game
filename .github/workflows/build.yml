name: 打包贪吃蛇

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== 原有桌面端打包（完全保留，未改动） ==========
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: 贪吃蛇-linux
          - os: windows-latest
            artifact_name: 贪吃蛇-windows
          - os: macos-latest
            artifact_name: 贪吃蛇-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pygame pyinstaller

      - name: 打包
        shell: bash
        run: cd snake_game && pyinstaller --onefile --windowed --name="贪吃蛇" --paths=. --hidden-import=config --hidden-import=game_state --hidden-import=scenes --hidden-import=renderer --hidden-import=food --hidden-import=highscore --hidden-import=obstacles --hidden-import=sound main.py

      - name: 上传产物（Linux/Mac）
        if: runner.os != 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇 snake_game/dist/${{ matrix.artifact_name }}
      - name: 上传产物（Windows）
        if: runner.os == 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇.exe snake_game/dist/${{ matrix.artifact_name }}.exe
      - name: 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: snake_game/dist/${{ matrix.artifact_name }}*

  # ========== 新增 Android 打包 job ==========
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest   # Buildozer 必须在 Linux 环境运行
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 使用 Buildozer 构建 APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .          # 你的 buildozer.spec 文件所在的目录（根目录）
          command: buildozer android debug   # 构建调试版 APK

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: 贪吃蛇-android
          path: ${{ steps.buildozer.outputs.filename }}
