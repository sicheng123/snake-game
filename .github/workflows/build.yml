name: 打包贪吃蛇

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== 原有桌面端打包（完全保留，未改动） ==========
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: 贪吃蛇-linux
          - os: windows-latest
            artifact_name: 贪吃蛇-windows
          - os: macos-latest
            artifact_name: 贪吃蛇-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统音频依赖（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils

      - name: 安装依赖
        run: pip install pygame pyinstaller

      - name: 打包
        shell: bash
        run: cd snake_game && pyinstaller --onefile --windowed --name="贪吃蛇" --paths=. --hidden-import=pygame --hidden-import=config --hidden-import=game_state --hidden-import=scenes --hidden-import=renderer --hidden-import=food --hidden-import=highscore --hidden-import=obstacles --hidden-import=sound main.py

      - name: 上传产物（Linux/Mac）
        if: runner.os != 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇 snake_game/dist/${{ matrix.artifact_name }}
      - name: 上传产物（Windows）
        if: runner.os == 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇.exe snake_game/dist/${{ matrix.artifact_name }}.exe
      - name: 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: snake_game/dist/${{ matrix.artifact_name }}*

  # ========== Android 打包 job ==========
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            autoconf automake libtool libffi-dev cmake zip unzip \
            openjdk-17-jdk libltdl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 安装 Buildozer
        run: pip install buildozer "cython<3"

      - name: 缓存 Buildozer 依赖
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 构建 Android APK
        run: buildozer android debug

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: 贪吃蛇-android
          path: bin/*.apk
