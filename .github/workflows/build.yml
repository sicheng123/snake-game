name: 打包贪吃蛇

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========== 原有桌面端打包（完全保留，未改动） ==========
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: 贪吃蛇-linux
          - os: windows-latest
            artifact_name: 贪吃蛇-windows
          - os: macos-latest
            artifact_name: 贪吃蛇-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统音频依赖（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils

      - name: 安装依赖
        run: pip install pygame pyinstaller

      - name: 打包
        shell: bash
        run: cd snake_game && pyinstaller --onefile --windowed --name="贪吃蛇" --paths=. --hidden-import=pygame --hidden-import=config --hidden-import=game_state --hidden-import=scenes --hidden-import=renderer --hidden-import=food --hidden-import=highscore --hidden-import=obstacles main.py

      - name: 上传产物（Linux/Mac）
        if: runner.os != 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇 snake_game/dist/${{ matrix.artifact_name }}
      - name: 上传产物（Windows）
        if: runner.os == 'Windows'
        run: |
          mv snake_game/dist/贪吃蛇.exe snake_game/dist/${{ matrix.artifact_name }}.exe
      - name: 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: snake_game/dist/${{ matrix.artifact_name }}*

  # ========== Android APK 构建 ==========
  android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            cmake \
            libffi-dev \
            libssl-dev \
            git \
            zip \
            unzip \
            python3-pip \
            python3-venv
          # 新版 libtool 移除了 LT_SYS_SYMBOL_USCORE 宏，p4a 的 libffi recipe 仍在使用
          # 在系统 aclocal 目录注入空实现，让 autoreconf 能通过
          sudo tee /usr/share/aclocal/lt_usc_fix.m4 << 'EOF' > /dev/null
          AC_DEFUN([LT_SYS_SYMBOL_USCORE],[sys_symbol_underscore=no])
          EOF

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: 设置 Android SDK
        run: |
          # 直接安装到 Buildozer 期望的 SDK 路径
          BUILDOZER_SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BUILDOZER_SDK/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $BUILDOZER_SDK/cmdline-tools
          mv $BUILDOZER_SDK/cmdline-tools/cmdline-tools $BUILDOZER_SDK/cmdline-tools/latest

          # 接受许可并安装 SDK 组件
          yes | $BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$BUILDOZER_SDK --licenses 2>/dev/null || true
          $BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$BUILDOZER_SDK "build-tools;34.0.0" "platforms;android-33" "platform-tools"

          # Buildozer 在旧路径 tools/bin/sdkmanager 查找 sdkmanager，创建符号链接
          mkdir -p $BUILDOZER_SDK/tools/bin
          ln -sf $BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager $BUILDOZER_SDK/tools/bin/sdkmanager

          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$BUILDOZER_SDK" >> $GITHUB_ENV

      - name: 缓存 Buildozer 依赖
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 构建 APK
        run: buildozer android debug
        timeout-minutes: 45

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 贪吃蛇-android
          path: "*.apk"



